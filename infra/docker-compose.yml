services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: voxpoll-backend:dev
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    volumes:
      - ../backend/data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  agent:
    image: voxpoll-backend:dev
    env_file:
      - ../backend/.env
    volumes:
      - ../backend/data:/app/data
    command: python -m app.callbot.agent dev
    depends_on:
      - backend

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: voxpoll-frontend:dev
    ports:
      - "3000:3000"
    env_file:
      - ../frontend/.env
    depends_on:
      - backend
